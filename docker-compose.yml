version: '3.8'

services:
  auto-learn:
    image: auto-learn-platform:latest
    build: .
    container_name: auto-learn-${USER_TAG:-default}
    environment:
      - USERNAME=${USERNAME}
      - PASSWORD=${PASSWORD}
      - CAPTCHA_MODE=auto
      - CAPTCHA_API_URL=${CAPTCHA_API_URL}
      - CAPTCHA_API_KEY=${CAPTCHA_API_KEY}
      - CHROME_DRIVER_PATH=/usr/bin/chromedriver
      - CHROME_BINARY_PATH=/usr/bin/chromium
      - MAX_PAGES=${MAX_PAGES:-999}
    volumes:
      # 持久化 cookies 和日志
      - ./data/${USER_TAG:-default}/cookies.pkl:/app/cookies.pkl
      - ./data/${USER_TAG:-default}/logs:/app/logs
    restart: unless-stopped
    # 共享内存大小（Chrome 需要）
    shm_size: '2gb'
